<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <script>
    (function() {
      const LIGHT_HOURS = { winterSpring: [7, 17], summerFall: [10, 21] };
      const getPeriod = (month) => month >= 3 && month <= 8 ? 'summerFall' : 'winterSpring';
      const updateTheme = () => {
        const now = new Date();
        const [start, end] = LIGHT_HOURS[getPeriod(now.getMonth())];
        const hour = now.getHours();
        const isLight = hour >= start && hour < end;

        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
      };

      updateTheme();
      setInterval(updateTheme, 60000);
    })();
  </script>
  <script>
    MathJax = {
      options: { enableMenu: false },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <body>
    {%- include header.html -%}
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {%- include modal.html -%}
  </body>
  {%- include footer.html -%}
</html>
